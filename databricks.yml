# This is a Databricks asset bundle definition for cliq_dashboard.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cliq_dashboard
  uuid: 9141b83d-2e0d-458d-9cb7-da1f534cd2cf

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-23b1e284-5dc7.cloud.databricks.com
    variables:
      catalog: cliq_records
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://dbc-23b1e284-5dc7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jorgeenriquecatano@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jorgeenriquecatano@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cliq_records
      schema: prod
    permissions:
      - user_name: jorgeenriquecatano@hotmail.com
        level: CAN_MANAGE
