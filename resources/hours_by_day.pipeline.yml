# Pipeline to calculate hours by day per each user using cleaned bronze data

resources:
  pipelines:
    hours_by_day:
      name: hours_by_day
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/hours_by_day"

      libraries:
        - glob:
            include: ../src/hours_by_day/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
