resources:
  jobs:
    sample_job:
      name: cliq_dashboard_job
      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/data-csv/

      max_concurrent_runs: 4

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: extract_clean
          pipeline_task:
            pipeline_id: ${resources.pipelines.extract_clean.id}
            full_refresh: false

        - task_key: hours_by_day
          pipeline_task:
            pipeline_id: ${resources.pipelines.hours_by_day.id}
            full_refresh: false
          depends_on:
            - task_key: extract_clean

      queue:
        enabled: true

      performance_target: PERFORMANCE_OPTIMIZED

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
