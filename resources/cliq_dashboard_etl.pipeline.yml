# The main pipeline for cliq_dashboard

resources:
  pipelines:
    cliq_dashboard_etl:
      name: cliq_dashboard_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/cliq_dashboard_etl"

      libraries:
        - glob:
            include: ../src/cliq_dashboard_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
